name: coco_llava

# LLaVA-1.5-7B HACL-style paired EOS embeddings (dim 4096), COCO-trained.
# Density + Table-1 share this SAE structure. Caches produced by
# scripts/real_alpha/extract_llava_cache.py (--dataset coco|imagenet).
# latent_size = 16 x hidden (65536, TOTAL -> 32768/side for separated); k=256
# keeps the same 0.78% sparsity ratio as the CLIP baseline (k=32 / 4096).
data:
  dataset: coco
  cache_dir: cache/llava_coco
  split_train: train
  split_eval: test
  eval_samples: 0

training:
  lr: 5.0e-4
  num_epochs: 30
  batch_size: 1024
  weight_decay: 1.0e-5
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  k: 256
  latent_size: 65536
  hidden_size: 4096
  seed: 0
  dataloader_num_workers: 2
  device: cuda

methods:
  - name: shared
  - name: separated
  - name: iso_align
    aux_weight: 1.0e-4
  - name: group_sparse
    aux_weight: 0.05
  - name: ours
    base_method: separated

evaluations:
  - dataset: coco
    cache_dir: cache/llava_coco
    split: test
    tasks: [recon, retrieval]
  - dataset: imagenet
    cache_dir: cache/llava_imagenet
    split: val
    tasks: [recon, zeroshot_raw]
    n_classes: 1000
    n_templates: 80

output:
  root: outputs/real_exp_llava_coco
